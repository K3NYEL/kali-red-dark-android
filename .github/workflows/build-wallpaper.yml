name: Build wallpaper PNG

on:
  push:
    branches: [main]
    paths:
      - "assets/wallpapers/**"
      - ".github/workflows/build-wallpaper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Render phone wallpaper
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SVG renderer
        run: python -m pip install --upgrade cairosvg

      - name: Render 1080 x 2400 PNG
        run: |
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url="assets/wallpapers/kali-red-dark-wallpaper-portrait.svg",
              write_to="kali-red-dark-wallpaper-portrait.png",
              output_width=1080,
              output_height=2400,
          )
          PY

      - name: Upload phone wallpaper
        uses: actions/upload-artifact@v4
        with:
          name: kali-red-dark-wallpaper-1080x2400
          path: kali-red-dark-wallpaper-portrait.png
          if-no-files-found: error
          retention-days: 30
